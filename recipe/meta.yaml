{% set name = "bleach" %}
{% set version = "6.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 4202482733d85cedd04e59fcb2f89f4e4c7c385a78d3c3c23c30446843a37452

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - webencodings
  run_constrained:
    # css
    # drop upper pin per https://github.com/mozilla/bleach/pull/779
    - tinycss2 >=1.1.0

test:
  source_files:
    - tests
  imports:
    - bleach
  commands:
    - pip check
    - pytest tests -v
  requires:
    - pip
    - pytest

about:
  home: https://github.com/mozilla/bleach
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: Easy, whitelist-based HTML-sanitizing tool
  description: |
    Bleach is an allowed-list-based HTML sanitizing library that escapes or
    strips markup and attributes.
  dev_url: https://github.com/mozilla/bleach
  doc_url: https://bleach.readthedocs.io

extra:
  recipe-maintainers:
    - minrk
    - ocefpaf
